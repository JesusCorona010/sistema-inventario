name: DEPLOY - Verificar artefacto liberado
on:
  workflow_run:
    workflows: ["RELEASE - Sistema de Inventario"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag publicado (ej. v1.0.0)'
        required: true
        default: 'v1.0.0'
permissions:
  contents: read
jobs:
  deploy-runner:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolver versión publicada
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
          REPO: ${{ github.repository }}
        run: |
          if [ -n "$REQUESTED_VERSION" ]; then
            VERSION="$REQUESTED_VERSION"
          else
            VERSION="$(gh release view --repo "$REPO" --json tagName --jq .tagName)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Descargar ZIP publicado (no reconstruir)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: gh release download "$VERSION" --repo "$REPO" --pattern "sistema-inventario-$VERSION.zip" --dir .
      - name: Extraer paquete en runner temporal
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p despliegue
          unzip "sistema-inventario-$VERSION.zip" -d despliegue
          find despliegue -type f
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ejecutar y verificar programa liberado
        run: |
          cd despliegue
          python -m compileall -q src
          python src/producto.py
          python src/busqueda.py
      - name: Guardar evidencia
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-deploy-${{ steps.version.outputs.version }}
          path: despliegue/
