name: BUILD - Verificacion Python
on:
  push:
    branches: [main, 'test/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar sintaxis y compilar bytecode
        run: python -m compileall -q src tests
      - name: Ejecutar pruebas
        run: python -m unittest discover -s tests -v
