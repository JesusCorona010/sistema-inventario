name: RELEASE - Sistema de Inventario
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar sintaxis
        run: python -m compileall -q src tests
      - name: Ejecutar pruebas
        run: python -m unittest discover -s tests -v
      - name: Empaquetar código ejecutable
        run: zip -r "sistema-inventario-${GITHUB_REF_NAME}.zip" src -x '*/__pycache__/*' '*.pyc'
      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: sistema-inventario-${{ github.ref_name }}.zip
          generate_release_notes: true
